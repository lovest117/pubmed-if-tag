<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Pubmed IF Tag</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 320px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f8fafc;
    color: #1e293b;
    padding: 16px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid #e2e8f0;
  }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: 14px;
  }
  .title { font-size: 15px; font-weight: 600; }
  .subtitle { font-size: 11px; color: #64748b; margin-top: 2px; }
  .stats {
    background: white;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #e2e8f0;
  }
  .stat-row {
    display: flex; justify-content: space-between;
    font-size: 12px; padding: 4px 0;
  }
  .stat-row .label { color: #64748b; }
  .stat-row .value { font-weight: 600; color: #1e293b; }
  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
  }
  .status-on { background: #dcfce7; color: #16a34a; }
  .features {
    background: white;
    border-radius: 8px;
    padding: 12px;
    border: 1px solid #e2e8f0;
    margin-bottom: 12px;
  }
  .features h3 { font-size: 12px; margin-bottom: 8px; color: #475569; }
  .feature-item {
    display: flex; align-items: flex-start; gap: 6px;
    font-size: 12px; padding: 3px 0; color: #334155;
  }
  .feature-item .check { color: #16a34a; font-weight: 700; }
  .feature-item.todo { color: #94a3b8; }
  .feature-item.todo .check { color: #cbd5e1; }
  .footer {
    font-size: 10px; color: #94a3b8; text-align: center;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="logo">IF</div>
    <div>
      <div class="title">Pubmed IF Tag</div>
      <div class="subtitle">影响因子自动标注 · 免费替代ScholarScope</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat-row">
      <span class="label">状态</span>
      <span class="status-badge status-on">已启用</span>
    </div>
    <div class="stat-row">
      <span class="label">内置期刊数</span>
      <span class="value" id="journalCount">-</span>
    </div>
    <div class="stat-row">
      <span class="label">数据版本</span>
      <span class="value">JCR 2023 (2024.6)</span>
    </div>
  </div>

  <div class="features">
    <h3>功能清单</h3>
    <div class="feature-item"><span class="check">✓</span> 搜索结果页显示IF+高亮</div>
    <div class="feature-item"><span class="check">✓</span> 文章详情页显示IF</div>
    <div class="feature-item"><span class="check">✓</span> JCR分区标签 (Q1-Q4)</div>
    <div class="feature-item"><span class="check">✓</span> 颜色分级 (IF≥20红/≥10橙/≥5黄/≥2绿)</div>
    <div class="feature-item todo"><span class="check">○</span> 自动更新IF数据库</div>
    <div class="feature-item todo"><span class="check">○</span> 五年影响因子显示</div>
  </div>

  <div class="stats" style="margin-bottom:12px;">
    <div class="stat-row">
      <span class="label">版本</span>
      <span class="value">v1.0.0</span>
    </div>
    <div class="stat-row">
      <span class="label">遇到问题？</span>
      <a href="https://github.com/你的用户名/pubmed-if-helper/issues/new" target="_blank" style="color:#2563eb;text-decoration:none;font-weight:600;">提交反馈 →</a>
    </div>
  </div>

  <div class="footer">
    仅自用 · 数据来源 Clarivate JCR 2023<br>
    访问 pubmed.ncbi.nlm.nih.gov 即可生效
  </div>

<script src="data/journal-if.js"></script>
<script>
  document.getElementById('journalCount').textContent =
    Object.keys(window.JOURNAL_IF_DB || {}).length + ' 种';
</script>
</body>
</html>

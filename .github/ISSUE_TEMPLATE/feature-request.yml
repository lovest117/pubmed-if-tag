name: 功能建议
description: 想要的功能、觉得不好用的地方
title: "[建议] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scene
    attributes:
      label: 使用场景
      description: 你在做什么的时候觉得不方便？
      placeholder: 写综述时想按 IF 排序文献，现在得一个个看标签
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么改
      description: 有具体想法可以写，没有也可以只写场景
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: 当前版本
      description: 插件弹窗底部能看到
      placeholder: v1.0.4
    validations:
      required: false

name: 功能建议
description: 一句话说说你想要什么
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        想加什么功能、哪里用着别扭，一句话写下来就行，不用凑格式。
  - type: textarea
    id: idea
    attributes:
      label: 你的想法
      placeholder: 希望标签里能带五年影响因子
    validations:
      required: true

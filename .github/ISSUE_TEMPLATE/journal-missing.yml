name: 期刊未收录（无 IF 标签）
description: 某本期刊在 PubMed 上没出 IF 标签，填个刊名就能提交
title: "[期刊未收录] "
labels: ["journal"]
body:
  - type: markdown
    attributes:
      value: |
        只需要填**期刊名称**。IF 和分区由系统从 JCR 2023 表自动查，不用你去查。
        提交后机器人会直接写进期刊库并关闭本 Issue，你回插件点一次「更新期刊数据」就能拿到。
  - type: input
    id: journal
    attributes:
      label: 期刊名称
      description: PubMed 引用行里显示的那个写法即可，带点、带括号也没关系；填全称也可以
      placeholder: Nat Commun
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: 文献链接（可选）
      description: 随便一篇该期刊的 PubMed 链接或 PMID，方便核对
      placeholder: https://pubmed.ncbi.nlm.nih.gov/41253842/
    validations:
      required: false

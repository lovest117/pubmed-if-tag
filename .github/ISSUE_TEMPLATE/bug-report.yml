name: 问题反馈
description: 标签没显示、位置错乱、更新失败等，一句话就够
title: "[问题] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        一句话说清现象就行，截图直接拖到下面的输入框里。
        其它信息（插件版本、浏览器）如果不知道可以留空。
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 例如「Neuron. 2023 后面没有 IF 标签」「弹出更新失败」
      placeholder: Neuron. 2023 后面没标签，刷新几次也一样
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: 相关页面链接（可选）
      placeholder: https://pubmed.ncbi.nlm.nih.gov/37167965/
    validations:
      required: false
  - type: input
    id: shot
    attributes:
      label: 截图（可选）
      description: 直接把图片拖进来，或粘贴
    validations:
      required: false

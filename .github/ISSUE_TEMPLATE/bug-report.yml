name: 问题反馈
description: 标签没显示、位置错乱、更新失败等
title: "[问题] "
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: 出问题的页面链接
      description: PubMed 搜索页或某篇文章的 URL
      placeholder: https://pubmed.ncbi.nlm.nih.gov/?term=...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 出现在哪类页面
      options:
        - 搜索结果页
        - 文章详情页
        - 两者都有
        - 插件弹窗
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 具体现象
      description: 例如「Neuron. 2023 后面没有 IF 标签」「标签插到了作者名后面」
      placeholder: Neuron. 2023 Oct 4;111(19):3124-3138. 后面没有徽章，但库里有 neuron
    validations:
      required: true
  - type: textarea
    id: shot
    attributes:
      label: 截图
      description: 直接把截图拖进来即可
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 浏览器与版本
      placeholder: Edge 130 / Chrome 131，Windows 11
    validations:
      required: false

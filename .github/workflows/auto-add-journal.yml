name: 自动补录期刊

# 有人在仓库提交「期刊未收录」反馈时，自动解析并写入期刊库
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  auto-add:
    runs-on: ubuntu-latest
    # 只自动处理仓库所有者本人提交的反馈，避免他人写入公共数据
    if: github.event.issue.user.login == github.repository_owner
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解析 Issue 并写入期刊库
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 scripts/add_journal_from_issue.py

      - name: 提交变更
        if: steps.parse.outputs.key != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/journal-if.js
          git commit -m "自动补录期刊：${{ steps.parse.outputs.name }} (IF ${{ steps.parse.outputs.if }} ${{ steps.parse.outputs.q }})"
          git push

      - name: 回复成功
        if: steps.parse.outputs.key != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "已自动补录 **${{ steps.parse.outputs.name }}**（IF ${{ steps.parse.outputs.if }}，${{ steps.parse.outputs.q }}）。在插件弹窗点一次「一键更新 IF 库」即可拿到这条数据。"
          gh issue close "${{ github.event.issue.number }}"

      - name: 回复解析失败
        if: steps.parse.outputs.key == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --body "没能自动解析这条反馈。请确认 Issue 里保留了模板的四个字段名，且期刊缩写、IF、分区都填了（分区为 Q1-Q4）。也可以直接编辑 data/journal-if.js 提交。"
